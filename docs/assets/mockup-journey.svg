<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141433"/>
      <stop offset="1" stop-color="#0b0b20"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1280" height="440" fill="url(#jbg)" rx="24"/>
  <text x="640" y="56" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="700">From idea to Play Store</text>
  <text x="640" y="84" text-anchor="middle" fill="#9ca3af" font-size="15">One phase per chat — paste the real pnpm verify output before "continue"</text>

  <line x1="70" y1="200" x2="1210" y2="200" stroke="#374151" stroke-width="3"/>

  <g text-anchor="middle" font-size="13">
    <!-- nodes: cx from 70 to 1210 step ~103.6 -->
    <g><circle cx="70" cy="200" r="30" fill="#6366f1"/><text x="70" y="207" fill="#fff" font-weight="700" font-size="15">P0</text><text x="70" y="252" fill="#e5e7eb" font-weight="600">Discovery</text><text x="70" y="270" fill="#6b7280" font-size="11">no code</text></g>
    <g><circle cx="174" cy="200" r="30" fill="#7c6cf5"/><text x="174" y="207" fill="#fff" font-weight="700" font-size="15">P1</text><text x="174" y="252" fill="#e5e7eb" font-weight="600">PRD</text><text x="174" y="270" fill="#6b7280" font-size="11">requirements</text></g>
    <g><circle cx="277" cy="200" r="30" fill="#8b5cf6"/><text x="277" y="207" fill="#fff" font-weight="700" font-size="15">P2</text><text x="277" y="252" fill="#e5e7eb" font-weight="600">Architecture</text><text x="277" y="270" fill="#6b7280" font-size="11">system design</text></g>
    <g><circle cx="381" cy="200" r="30" fill="#a855f7"/><text x="381" y="207" fill="#fff" font-weight="700" font-size="14">P2b</text><text x="381" y="252" fill="#e5e7eb" font-weight="600">UX</text><text x="381" y="270" fill="#6b7280" font-size="11">wireframes</text></g>
    <g><circle cx="484" cy="200" r="30" fill="#c026d3"/><text x="484" y="207" fill="#fff" font-weight="700" font-size="15">P3</text><text x="484" y="252" fill="#e5e7eb" font-weight="600">Tasks</text><text x="484" y="270" fill="#6b7280" font-size="11">breakdown</text></g>
    <g><circle cx="588" cy="200" r="30" fill="#06b6d4"/><text x="588" y="207" fill="#fff" font-weight="700" font-size="15">P4</text><text x="588" y="252" fill="#e5e7eb" font-weight="600">Scaffold</text><text x="588" y="270" fill="#6b7280" font-size="11">web + mobile</text></g>
    <g><circle cx="691" cy="200" r="30" fill="#0ea5a4"/><text x="691" y="207" fill="#fff" font-weight="700" font-size="15">P5</text><text x="691" y="252" fill="#e5e7eb" font-weight="600">DB + Auth</text><text x="691" y="270" fill="#6b7280" font-size="11">supabase</text></g>
    <g><circle cx="795" cy="200" r="34" fill="#f59e0b"/><text x="795" y="207" fill="#fff" font-weight="700" font-size="15">P6</text><text x="795" y="252" fill="#e5e7eb" font-weight="600">Feature loop</text><text x="795" y="270" fill="#6b7280" font-size="11">1 task = 1 chat</text>
      <path d="M 795 158 a 26 26 0 1 1 -18 -45" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arr)"/>
    </g>
    <g><circle cx="898" cy="200" r="30" fill="#10b981"/><text x="898" y="207" fill="#fff" font-weight="700" font-size="15">P7</text><text x="898" y="252" fill="#e5e7eb" font-weight="600">Hardening</text><text x="898" y="270" fill="#6b7280" font-size="11">security audit</text></g>
    <g><circle cx="1002" cy="200" r="30" fill="#22c55e"/><text x="1002" y="207" fill="#fff" font-weight="700" font-size="15">P8</text><text x="1002" y="252" fill="#e5e7eb" font-weight="600">Deploy</text><text x="1002" y="270" fill="#6b7280" font-size="11">previews</text></g>
    <g><circle cx="1105" cy="200" r="30" fill="#4ade80"/><text x="1105" y="207" fill="#fff" font-weight="700" font-size="15">P9</text><text x="1105" y="252" fill="#e5e7eb" font-weight="600">Release</text><text x="1105" y="270" fill="#6b7280" font-size="11">rollback plan</text></g>
    <g><circle cx="1210" cy="200" r="34" fill="#16a34a" stroke="#bbf7d0" stroke-width="2"/><text x="1210" y="207" fill="#fff" font-weight="700" font-size="14">P10</text><text x="1210" y="252" fill="#e5e7eb" font-weight="600">Play Store</text><text x="1210" y="270" fill="#6b7280" font-size="11">launch</text></g>
  </g>

  <text x="640" y="330" text-anchor="middle" fill="#9ca3af" font-size="14">Defense in depth at every step: pnpm verify + CI + e2e + CodeQL + gitleaks</text>
  <text x="640" y="380" text-anchor="middle" fill="#4b5563" font-size="13">vibe-blueprint — prompts live in prompts/, one file per phase</text>
</svg>
